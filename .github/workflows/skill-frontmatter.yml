name: SKILL.md Frontmatter Lint

on:
  pull_request:
    paths:
      - "plugins/**/SKILL.md"
      - ".agents/skills/**/SKILL.md"
      - "mise.toml"
      - ".github/workflows/skill-frontmatter.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/**/SKILL.md"
      - ".agents/skills/**/SKILL.md"
      - "mise.toml"
      - ".github/workflows/skill-frontmatter.yml"

permissions:
  contents: read

jobs:
  lint-description:
    name: Reject multi-line YAML descriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SKILL.md descriptions are single-line
        run: |
          set -e
          # skills.sh meta-tag generator does not parse YAML scalar styles
          # (vercel-labs/skills#433), so multi-line frontmatter descriptions
          # render the literal indicator (e.g. `>-`) instead of the text.
          bad=$(grep -rnE '^description:[[:space:]]*([>|]|$)' plugins/ --include=SKILL.md || true)
          if [ -n "$bad" ]; then
            echo "::error::SKILL.md descriptions must be a single-line plain or quoted string."
            echo "::error::See vercel-labs/skills#433 — skills.sh does not parse YAML folded/literal scalars."
            echo ""
            echo "Offending files:"
            echo "$bad"
            exit 1
          fi
          echo "All SKILL.md descriptions are single-line."

  validate-spec:
    name: Validate skills against the Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate every skill with trg
        run: |
          status=0
          while IFS= read -r skill; do
            dir=$(dirname "$skill")
            echo "::group::$dir"
            trg ai skills validate "$dir" || { echo "::error file=$skill::trg ai skills validate failed"; status=1; }
            echo "::endgroup::"
          done < <(find plugins .agents/skills -name SKILL.md -type f | sort)
          exit $status
