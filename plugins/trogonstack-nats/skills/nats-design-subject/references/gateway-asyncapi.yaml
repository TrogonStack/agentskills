asyncapi: 3.0.0
info:
  title: Trogon Gateway Messaging API
  version: 1.0.0
  description: Application channels for gateway ingress, health request-reply, and durable work publication.
defaultContentType: application/json
servers:
  nats:
    host: nats.example.internal
    protocol: nats
    description: NATS server selected by deployment configuration.
channels:
  githubIngress:
    address: gateway.ingress.raw.github.v1.{event}
    description: GitHub webhook events published by the gateway. The deployment stream filter is gateway.ingress.raw.github.v1.>.
    parameters:
      event:
        description: GitHub event name.
        enum:
          - pull_request
          - issues
          - installation
    messages:
      githubWebhook:
        $ref: '#/components/messages/githubWebhook'
  slackIngress:
    address: gateway.ingress.raw.slack.v1.{event}
    description: Slack webhook events published by the gateway. The deployment stream filter is gateway.ingress.raw.slack.v1.>.
    parameters:
      event:
        description: Slack event name.
        enum:
          - event_callback
          - url_verification
    messages:
      slackWebhook:
        $ref: '#/components/messages/slackWebhook'
  healthRequest:
    address: gateway.rpc.v1.health
    description: Synchronous health request handled by the gateway.
    messages:
      healthRequest:
        $ref: '#/components/messages/healthRequest'
  healthReply:
    address: null
    description: Generated inbox used for health replies.
    messages:
      healthResponse:
        $ref: '#/components/messages/healthResponse'
  installationSync:
    address: gateway.work.v1.installation_sync
    description: Work publication for installation synchronization.
    messages:
      installationSync:
        $ref: '#/components/messages/installationSync'
operations:
  publishGithubWebhook:
    action: send
    channel:
      $ref: '#/channels/githubIngress'
    messages:
      - $ref: '#/channels/githubIngress/messages/githubWebhook'
  publishSlackWebhook:
    action: send
    channel:
      $ref: '#/channels/slackIngress'
    messages:
      - $ref: '#/channels/slackIngress/messages/slackWebhook'
  receiveHealthRequest:
    action: receive
    channel:
      $ref: '#/channels/healthRequest'
    messages:
      - $ref: '#/channels/healthRequest/messages/healthRequest'
    reply:
      channel:
        $ref: '#/channels/healthReply'
      messages:
        - $ref: '#/channels/healthReply/messages/healthResponse'
  publishInstallationSync:
    action: send
    channel:
      $ref: '#/channels/installationSync'
    messages:
      - $ref: '#/channels/installationSync/messages/installationSync'
components:
  messages:
    githubWebhook:
      name: githubWebhook
      title: GitHub webhook
      payload:
        type: object
        required:
          - deliveryId
          - event
        properties:
          deliveryId:
            type: string
          event:
            type: string
          payload:
            type: object
            additionalProperties: true
        additionalProperties: true
    slackWebhook:
      name: slackWebhook
      title: Slack webhook
      payload:
        type: object
        required:
          - event
        properties:
          event:
            type: string
          payload:
            type: object
            additionalProperties: true
        additionalProperties: true
    healthRequest:
      name: healthRequest
      title: Health request
      payload:
        type: object
        additionalProperties: false
    healthResponse:
      name: healthResponse
      title: Health response
      payload:
        type: object
        required:
          - status
        properties:
          status:
            type: string
            enum:
              - ok
              - degraded
        additionalProperties: false
    installationSync:
      name: installationSync
      title: Installation synchronization work
      payload:
        type: object
        required:
          - installationId
        properties:
          installationId:
            type: string
        additionalProperties: false
